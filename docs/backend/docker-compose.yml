version: '3.8'

services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - /app/node_modules
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:5000
      - REACT_APP_USE_MOCK_PREDICTIONS=false
    command: npm start

  backend:
    image: python:3.9
    working_dir: /app
    ports:
      - "5000:5000"
    volumes:
      - ../greenfuel-ml-frontend:/app
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
    command: >
      bash -c "pip install -r requirements.txt &&
               python app.py"
    depends_on:
      - frontend
