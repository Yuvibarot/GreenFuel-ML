service: greenfuel-ml-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.9
  region: us-east-1
  environment:
    PYTHONPATH: /opt/python:/var/runtime
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"

functions:
  predict:
    handler: app.predict_handler
    events:
      - http:
          path: predict
          method: post
          cors: true
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:us-east-1:ACCOUNT_ID:layer:python-dependencies:1

  health:
    handler: app.health_handler
    events:
      - http:
          path: health
          method: get
          cors: true

  modelInfo:
    handler: app.model_info_handler
    events:
      - http:
          path: model-info
          method: get
          cors: true

  batchPredict:
    handler: app.batch_predict_handler
    events:
      - http:
          path: batch-predict
          method: post
          cors: true
    timeout: 120
    memorySize: 1024

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    useDownloadCache: true
    useStaticCache: true
